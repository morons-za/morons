<!DOCTYPE html>
<html>
<head>
    <title>API Test Page</title>
    <meta charset="UTF-8">
</head>
<body>
    <h1>API Test Page</h1>
    <div id="results"></div>
    
    <button onclick="testRefresh()">Test Refresh Metadata</button>
    <button onclick="testProcess()">Test Process KMLs</button>
    <button onclick="testValidate()">Test Validate</button>
    
    <script>
        const resultsDiv = document.getElementById('results');
        
        function log(message) {
            resultsDiv.innerHTML += '<div>' + new Date().toLocaleTimeString() + ': ' + message + '</div>';
        }
        
        async function testRefresh() {
            log('Testing refresh-metadata...');
            try {
                const response = await fetch('/refresh-metadata', { method: 'POST' });
                const result = await response.json();
                log('✅ Refresh success: ' + JSON.stringify(result));
            } catch (error) {
                log('❌ Refresh error: ' + error.message);
            }
        }
        
        async function testProcess() {
            log('Testing process-kmls...');
            try {
                const response = await fetch('/process-kmls', { method: 'POST' });
                const result = await response.json();
                log('✅ Process success: ' + JSON.stringify(result));
            } catch (error) {
                log('❌ Process error: ' + error.message);
            }
        }
        
        async function testValidate() {
            log('Testing validate-files...');
            try {
                const response = await fetch('/validate-files');
                const result = await response.json();
                log('✅ Validate success: Found ' + result.counts.uploads + ' files');
            } catch (error) {
                log('❌ Validate error: ' + error.message);
            }
        }
        
        // Auto-test on load
        log('Page loaded, ready to test APIs');
    </script>
</body>
</html>
