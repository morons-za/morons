name: Daily Flight Sync

on:
  schedule:
    # Temporary: run at 20:00 UTC (22:00 SAST) for testing
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: 'Lookback hours (default: 48)'
        required: false
        default: '48'
      dry_run:
        description: 'Dry run (no file changes or emails)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Write credentials file
        run: |
          cat > API/credentials.json << 'CREDS_EOF'
          {
            "FR24_TOKEN": "${{ secrets.FR24_TOKEN }}",
            "SENDGRID_API_KEY": "${{ secrets.SENDGRID_API_KEY }}",
            "HMAC_SECRET": "${{ secrets.HMAC_SECRET }}"
          }
          CREDS_EOF

      - name: Run daily sync
        env:
          FR24_TOKEN: ${{ secrets.FR24_TOKEN }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          HMAC_SECRET: ${{ secrets.HMAC_SECRET }}
        run: |
          ARGS="--hours ${{ github.event.inputs.hours || '48' }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          node API/daily-sync.cjs $ARGS

      - name: Commit and push changes
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A backend/uploads/ static-site/kml-optimised/ backend/flight-maps/ static-site/pending-review.json static-site/master-metadata.json static-site/index.html
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            CHANGES=$(git diff --cached --stat | tail -1)
            git commit -m "daily-sync: $(date -u +%Y-%m-%d) — $CHANGES"
            git push
          fi

      - name: Clean up credentials
        if: always()
        run: rm -f API/credentials.json
