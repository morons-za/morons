name: Daily Flight Sync

on:
  schedule:
    # Run 3x daily at 08:00, 14:00, 20:00 SAST (was 5x/day — cut to reduce
    # FR24 credit usage; the checked-flights cache in daily-sync.cjs removes
    # most of the redundant re-querying this used to cause anyway)
    - cron: '0 6,12,18 * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: 'Lookback hours (default: 48)'
        required: false
        default: '48'
      dry_run:
        description: 'Dry run (no file changes or emails)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Write credentials file
        run: |
          cat > API/credentials.json << 'CREDS_EOF'
          {
            "FR24_TOKEN": "${{ secrets.FR24_TOKEN }}",
            "SENDGRID_API_KEY": "${{ secrets.SENDGRID_API_KEY }}",
            "HMAC_SECRET": "${{ secrets.HMAC_SECRET }}"
          }
          CREDS_EOF

      - name: Capture pre-sync flight count
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -f static-site/master-metadata.json ]; then
            BEFORE_FLIGHT_COUNT=$(node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('static-site/master-metadata.json','utf8')); process.stdout.write(String((d.flights||[]).length));")
          else
            BEFORE_FLIGHT_COUNT=0
          fi
          echo "BEFORE_FLIGHT_COUNT=$BEFORE_FLIGHT_COUNT" >> "$GITHUB_ENV"
          echo "Pre-sync flights: $BEFORE_FLIGHT_COUNT"

      - name: Run daily sync
        env:
          FR24_TOKEN: ${{ secrets.FR24_TOKEN }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          HMAC_SECRET: ${{ secrets.HMAC_SECRET }}
        run: |
          ARGS="--hours ${{ github.event.inputs.hours || '48' }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          node API/daily-sync.cjs $ARGS

      - name: Rebuild static site if new flights added
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -f static-site/master-metadata.json ]; then
            AFTER_FLIGHT_COUNT=$(node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('static-site/master-metadata.json','utf8')); process.stdout.write(String((d.flights||[]).length));")
          else
            AFTER_FLIGHT_COUNT=0
          fi
          BEFORE="${BEFORE_FLIGHT_COUNT:-0}"
          echo "Post-sync flights: $AFTER_FLIGHT_COUNT"
          if [ "$AFTER_FLIGHT_COUNT" -gt "$BEFORE" ]; then
            echo "New flights detected ($BEFORE -> $AFTER_FLIGHT_COUNT). Rebuilding static site..."
            node backend/scripts/build-static-site.cjs
          else
            echo "No new flights added ($BEFORE -> $AFTER_FLIGHT_COUNT). Skipping static site rebuild."
          fi

      - name: Commit and push changes
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Keep backend metadata mirrored to the static metadata source.
          if [ -f static-site/master-metadata.json ]; then
            cp static-site/master-metadata.json backend/scripts/master-metadata.json
          fi

          git add -A backend/uploads/ static-site/kml-optimised/ backend/flight-maps/ static-site/pending-review.json static-site/master-metadata.json backend/scripts/master-metadata.json static-site/index.html

          # Guarded separately: unlike the paths above, this file is only
          # ever written conditionally by the sync script. A literal path
          # that doesn't exist would make git add fail outright (this is
          # exactly what broke every run for over a week in July).
          if [ -f API/checked-flights-cache.json ]; then
            git add API/checked-flights-cache.json
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            CHANGES=$(git diff --cached --stat | tail -1)
            git commit -m "daily-sync: $(date -u +%Y-%m-%d) — $CHANGES [skip netlify]"
            git push
          fi

      - name: Configure Pages
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: static-site

      # actions/deploy-pages has intermittent "Deployment failed, try again later"
      # failures on GitHub's side (see actions/deploy-pages#406, ongoing since Jan
      # 2026). Retry a few times before giving up so a transient blip doesn't
      # fail the whole run.
      - name: Deploy to GitHub Pages (attempt 1/3)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retry 1
        if: ${{ github.event.inputs.dry_run != 'true' && steps.deploy1.outcome == 'failure' }}
        run: sleep 20

      - name: Deploy to GitHub Pages (attempt 2/3)
        if: ${{ github.event.inputs.dry_run != 'true' && steps.deploy1.outcome == 'failure' }}
        id: deploy2
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retry 2
        if: ${{ github.event.inputs.dry_run != 'true' && steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' }}
        run: sleep 45

      - name: Deploy to GitHub Pages (attempt 3/3)
        if: ${{ github.event.inputs.dry_run != 'true' && steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' }}
        id: deploy3
        uses: actions/deploy-pages@v4

      - name: Purge Cloudflare cache
        if: ${{ success() && github.event.inputs.dry_run != 'true' }}
        run: |
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'

      - name: Clean up credentials
        if: always()
        run: rm -f API/credentials.json
